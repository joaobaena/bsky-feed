<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluesky Feed</title>

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #eef3f8;
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
}

input {
  width: 100%;
  padding: 10px;
  border: none;
  border-bottom: 1px solid #ddd;
  outline: none;
}

.post {
  display: flex;
  gap: 10px;
  background: white;
  padding: 12px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
}

.post:hover {
  background: #f5f8fa;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-size: cover;
}

.content { flex: 1; }

.topline {
  display: flex;
  gap: 6px;
  font-size: 14px;
  flex-wrap: wrap;
}

.author { font-weight: bold; }
.handle, .time { color: gray; }

.text {
  margin: 6px 0;
  white-space: pre-wrap;
}

img.embed {
  width: 100%;
  border-radius: 10px;
  margin-top: 5px;
}

.actions {
  display: flex;
  gap: 15px;
  font-size: 13px;
  color: gray;
  margin-top: 6px;
}

.label {
  font-size: 12px;
  color: gray;
  margin-bottom: 4px;
}

.thread {
  margin-left: 50px;
  border-left: 2px solid #ddd;
  padding-left: 10px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">Custom Bluesky Feed</div>
  <input id="filter" placeholder="Filter posts..." />
  <div id="feed"></div>
</div>

<script>
const users = [
  "viniciusduarte.bsky.social",
  "judeuateu.bsky.social",
  "caioalmendra.bsky.social",
  "carapanarana.bsky.social",
  "sk-serge.bsky.social",
  "osrjacinto.bsky.social",
  "helldude.bsky.social",
  "shaunvids.bsky.social"
];

let postsMap = new Map();

async function fetchFeed(user) {
  const url = `https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=${user}`;
  const res = await fetch(url);
  const data = await res.json();

  return data.feed.map(item => {
    const p = item.post;

    return {
      id: p.uri,
      uri: p.uri,
      cid: p.cid,

      author: p.author.displayName || p.author.handle,
      handle: p.author.handle,
      avatar: p.author.avatar,

      text: p.record.text,
      time: p.record.createdAt,

      likes: p.likeCount || 0,
      reposts: p.repostCount || 0,
      replyCount: p.replyCount || 0,

      images: p.embed?.images?.map(img => img.fullsize) || [],

      isRepost: !!item.reason,
      repostedBy: item.reason?.by?.displayName || item.reason?.by?.handle || null,

      isReply: !!item.reply,
      replyTo: item.reply?.parent?.author?.handle || null
    };
  });
}

function postURL(post) {
  const parts = post.uri.split("/");
  const rkey = parts[parts.length - 1];
  return `https://bsky.app/profile/${post.handle}/post/${rkey}`;
}

function renderPost(post) {
  const div = document.createElement("div");
  div.className = "post";

  div.onclick = () => window.open(postURL(post), "_blank");

  div.innerHTML = `
    <div class="avatar" style="background-image:url('${post.avatar}')"></div>

    <div class="content">

      ${post.isRepost ? `<div class="label">🔁 ${post.repostedBy} reposted</div>` : ""}

      ${post.isReply ? `<div class="label">↩ replying to @${post.replyTo}</div>` : ""}

      <div class="topline">
        <span class="author">${post.author}</span>
        <span class="handle">@${post.handle}</span>
        <span class="time">· ${new Date(post.time).toLocaleString()}</span>
      </div>

      <div class="text">${post.text}</div>

      ${post.images.map(img => `<img class="embed" src="${img}">`).join("")}

      <div class="actions">
        💬 ${post.replyCount}
        🔁 ${post.reposts}
        ❤️ ${post.likes}
        <span class="expand" data-uri="${post.uri}">🧵 View thread</span>
      </div>

      <div class="thread" id="thread-${post.id}"></div>
    </div>
  `;

  // thread loader
  div.querySelector(".expand").onclick = async (e) => {
    e.stopPropagation();

    const container = div.querySelector(`#thread-${post.id}`);
    if (container.innerHTML) {
      container.innerHTML = "";
      return;
    }

    const url = `https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=${post.uri}`;
    const res = await fetch(url);
    const data = await res.json();

    const replies = data.thread?.replies || [];

    replies.forEach(r => {
      const rp = r.post;
      const el = document.createElement("div");
      el.className = "post";

      el.innerHTML = `
        <div class="avatar" style="background-image:url('${rp.author.avatar}')"></div>
        <div class="content">
          <div class="topline">
            <span class="author">${rp.author.displayName || rp.author.handle}</span>
            <span class="handle">@${rp.author.handle}</span>
          </div>
          <div class="text">${rp.record.text}</div>
        </div>
      `;

      container.appendChild(el);
    });
  };

  return div;
}

function updateFeed(newPosts) {
  const feed = document.getElementById("feed");
  const filterText = document.getElementById("filter").value.toLowerCase();

  newPosts.forEach(post => {
    if (postsMap.has(post.id)) return;

    postsMap.set(post.id, post);

    if (filterText && !post.text.toLowerCase().includes(filterText)) return;

    const el = renderPost(post);
    feed.prepend(el);
  });
}

async function refresh() {
  let all = [];

  for (let u of users) {
    try {
      const posts = await fetchFeed(u);
      all = all.concat(posts);
    } catch {}
  }

  all.sort((a,b)=> new Date(b.time)-new Date(a.time));
  updateFeed(all);
}

// filter
document.getElementById("filter").addEventListener("input", () => {
  document.getElementById("feed").innerHTML = "";
  postsMap.clear();
  refresh();
});

// init
refresh();
setInterval(refresh, 45000);
</script>

</body>
</html>
