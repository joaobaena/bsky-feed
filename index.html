<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluesky Feed</title>

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #eef3f8;
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
}

input {
  width: 100%;
  padding: 10px;
  border: none;
  border-bottom: 1px solid #ddd;
  outline: none;
}

.post {
  display: flex;
  gap: 10px;
  background: white;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-size: cover;
}

.content { flex: 1; }

.topline {
  display: flex;
  gap: 5px;
  font-size: 14px;
}

.author { font-weight: bold; }
.handle, .time { color: gray; }

.text {
  margin: 6px 0;
  white-space: pre-wrap;
}

img.embed {
  width: 100%;
  border-radius: 10px;
  margin-top: 5px;
}

.actions {
  display: flex;
  gap: 15px;
  font-size: 13px;
  color: gray;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">Custom Bluesky Feed</div>
  <input id="filter" placeholder="Filter posts..." />
  <div id="feed"></div>
</div>

<script>
const users = [
  "viniciusduarte.bsky.social",
  "judeuateu.bsky.social",
  "caioalmendra.bsky.social",
  "carapanarana.bsky.social",
  "sk-serge.bsky.social",
  "osrjacinto.bsky.social"
];

let postsMap = new Map();

async function fetchFeed(user) {
  const url = `https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=${user}`;
  const res = await fetch(url);
  const data = await res.json();

  return data.feed.map(item => {
    const p = item.post;
    return {
      id: p.uri,
      author: p.author.displayName || p.author.handle,
      handle: p.author.handle,
      avatar: p.author.avatar,
      text: p.record.text,
      time: p.record.createdAt,
      likes: p.likeCount || 0,
      reposts: p.repostCount || 0,
      replyCount: p.replyCount || 0,
      images: p.embed?.images?.map(img => img.fullsize) || []
    };
  });
}

function renderPost(post) {
  const div = document.createElement("div");
  div.className = "post";

  div.innerHTML = `
    <div class="avatar" style="background-image:url('${post.avatar}')"></div>
    <div class="content">
      <div class="topline">
        <span class="author">${post.author}</span>
        <span class="handle">@${post.handle}</span>
        <span class="time">· ${new Date(post.time).toLocaleTimeString()}</span>
      </div>

      <div class="text">${post.text}</div>

      ${post.images.map(img => `<img class="embed" src="${img}">`).join("")}

      <div class="actions">
        💬 ${post.replyCount}
        🔁 ${post.reposts}
        ❤️ ${post.likes}
      </div>
    </div>
  `;

  return div;
}

function updateFeed(newPosts) {
  const feed = document.getElementById("feed");
  const filterText = document.getElementById("filter").value.toLowerCase();

  newPosts.forEach(post => {
    if (postsMap.has(post.id)) return;

    postsMap.set(post.id, post);

    if (filterText && !post.text.toLowerCase().includes(filterText)) return;

    const el = renderPost(post);
    feed.prepend(el);
  });
}

async function refresh() {
  let all = [];

  for (let u of users) {
    try {
      const posts = await fetchFeed(u);
      all = all.concat(posts);
    } catch {}
  }

  all.sort((a,b)=> new Date(b.time)-new Date(a.time));

  updateFeed(all);
}

// filter live
document.getElementById("filter").addEventListener("input", () => {
  document.getElementById("feed").innerHTML = "";
  postsMap.clear();
  refresh();
});

// initial + auto refresh
refresh();
setInterval(refresh, 45000);
</script>

</body>
</html>
