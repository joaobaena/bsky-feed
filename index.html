<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluesky Feed</title>

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #eef3f8;
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
}

.controls {
  background: white;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

input {
  width: 100%;
  padding: 8px;
  margin-bottom: 5px;
}

.post {
  display: flex;
  gap: 10px;
  background: white;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-size: cover;
}

.content { flex: 1; }

.author { font-weight: bold; }
.handle, .time { color: gray; }

.text {
  margin: 6px 0;
  white-space: pre-wrap;
}

img.embed {
  width: 100%;
  border-radius: 10px;
  margin-top: 5px;
}

.quote {
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 8px;
  margin-top: 6px;
  background: #f9f9f9;
}

.thread {
  margin-left: 50px;
  border-left: 2px solid #ddd;
  padding-left: 10px;
}

.actions {
  font-size: 13px;
  color: gray;
  margin-top: 5px;
  cursor: pointer;
}

.label {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">Custom Bluesky Feed</div>

  <div class="controls">
    <input id="accounts" placeholder="Accounts (comma separated)">
    <input id="filter" placeholder="Filter posts...">
  </div>

  <div id="feed"></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [
  "viniciusduarte.bsky.social",
  "judeuateu.bsky.social",
  "caioalmendra.bsky.social",
  "carapanarana.bsky.social",
  "sk-serge.bsky.social",
  "osrjacinto.bsky.social",
  "helldude.bsky.social",
  "shaunvids.bsky.social”,
  "arnaldobranco.bsky.social”,
  "laranjadinho.deichator.ar”
];
document.getElementById("accounts").value = users.join(",");

let postsMap = new Map();

document.getElementById("accounts").addEventListener("change", () => {
  users = document.getElementById("accounts").value.split(",").map(x=>x.trim());
  localStorage.setItem("users", JSON.stringify(users));
  resetFeed();
});

function resetFeed() {
  document.getElementById("feed").innerHTML = "";
  postsMap.clear();
  refresh();
}

async function fetchFeed(user) {
  const res = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=${user}`);
  const data = await res.json();

  return data.feed.map(item => {
    const p = item.post;

    return {
      id: p.uri,
      uri: p.uri,
      author: p.author.displayName || p.author.handle,
      handle: p.author.handle,
      avatar: p.author.avatar,
      text: p.record.text,
      time: p.record.createdAt,

      likes: p.likeCount || 0,
      reposts: p.repostCount || 0,

      embed: p.embed || null,

      isRepost: !!item.reason,
      repostedBy: item.reason?.by?.handle || null
    };
  });
}

function renderQuote(embed) {
  if (!embed || !embed.record) return "";

  const q = embed.record;
  const author = q.author?.handle || "unknown";
  const text = q.value?.text || "";

  return `
    <div class="quote">
      <div><b>@${author}</b></div>
      <div>${text}</div>
    </div>
  `;
}

function renderPost(post) {
  const div = document.createElement("div");
  div.className = "post";

  div.innerHTML = `
    <div class="avatar" style="background-image:url('${post.avatar}')"></div>
    <div class="content">

      ${post.isRepost ? `<div class="label">🔁 ${post.repostedBy} reposted</div>` : ""}

      <div>
        <span class="author">${post.author}</span>
        <span class="handle">@${post.handle}</span>
        <span class="time">${new Date(post.time).toLocaleTimeString()}</span>
      </div>

      <div class="text">${post.text}</div>

      ${post.embed?.images?.map(i=>`<img class="embed" src="${i.fullsize}">`).join("") || ""}

      ${renderQuote(post.embed)}

      <div class="actions" onclick="loadThread('${post.uri}', this)">
        🧵 View thread
      </div>

      <div class="thread"></div>
    </div>
  `;

  return div;
}

function renderThreadNode(node, container) {
  if (!node || !node.post) return;

  const p = node.post;

  const div = document.createElement("div");
  div.className = "post";

  div.innerHTML = `
    <div class="avatar" style="background-image:url('${p.author.avatar}')"></div>
    <div class="content">
      <div><b>${p.author.handle}</b></div>
      <div class="text">${p.record.text}</div>
    </div>
  `;

  container.appendChild(div);

  if (node.replies) {
    const childContainer = document.createElement("div");
    childContainer.className = "thread";
    container.appendChild(childContainer);

    node.replies.forEach(r => renderThreadNode(r, childContainer));
  }
}

async function loadThread(uri, el) {
  const container = el.parentElement.querySelector(".thread");

  if (container.innerHTML) {
    container.innerHTML = "";
    return;
  }

  const res = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=${uri}`);
  const data = await res.json();

  renderThreadNode(data.thread, container);
}

function updateFeed(posts) {
  const feed = document.getElementById("feed");
  const filter = document.getElementById("filter").value.toLowerCase();

  posts.forEach(post => {
    if (postsMap.has(post.id)) return;
    postsMap.set(post.id, post);

    if (filter && !post.text.toLowerCase().includes(filter)) return;

    feed.prepend(renderPost(post));
  });
}

async function refresh() {
  let all = [];

  for (let u of users) {
    try {
      const posts = await fetchFeed(u);
      all = all.concat(posts);
    } catch {}
  }

  all.sort((a,b)=> new Date(a.time)-new Date(b.time));
  updateFeed(all);
}

document.getElementById("filter").addEventListener("input", resetFeed);

refresh();
setInterval(refresh, 45000);
</script>

</body>
</html>
